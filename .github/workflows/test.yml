name: Tests

on:
  pull_request:
    branches:
      - main
  merge_group:
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6.3"
  GODOT_LINUX_SHA256: "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          echo "${GODOT_LINUX_SHA256}  godot.zip" | sha256sum -c -
          unzip godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
          sudo mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Cache Godot import artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'addons/**', '**/*.import') }}

      - name: Import Project
        run: godot --headless --path . --import 2>&1 || true

      - name: Run Tests
        run: |
          mkdir -p logs
          set -o pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gconfig=.gutconfig.json -gexit 2>&1 | tee test_output.txt

      - name: Leak gate
        run: |
          set -e
          sed -E 's/\x1b\[[0-9;]*m//g' test_output.txt > test_output.plain
          fail=0
          warnings=$(awk '
          {
            if (match($0, /^WARNING: .* ext_resource, invalid UID: .* using text path instead: (res:\/\/[^ ]+)/, m)) {
              cold_paths[m[1]] = 1
              next
            }
            if (match($0, /^ERROR: Failed loading resource: (res:\/\/[^ ]+)\./, m)) {
              next
            }
            if ($0 ~ /Parse Error: .* referenced non-existent resource/) next
            if ($0 ~ /^(WARNING|USER WARNING):/) print NR ":" $0
          }' test_output.plain || true)
          errors=$(awk '
          {
            if (match($0, /^WARNING: .* ext_resource, invalid UID: .* using text path instead: (res:\/\/[^ ]+)/, m)) {
              cold_paths[m[1]] = 1
              next
            }
            if (match($0, /^ERROR: Failed loading resource: (res:\/\/[^ ]+)\./, m)) {
              if (m[1] in cold_paths) next
              if (m[1] ~ /\.(png|webp|exr|hdr|gif|apng|wav|ogg|mp3|flac|mp4|webm|mov|ogv|psd|aseprite|ase|kra|svg)$/) next
              print NR ":" $0
              next
            }
            if ($0 ~ /Parse Error: .* referenced non-existent resource/) next
            if ($0 ~ /^(ERROR|SCRIPT ERROR|USER ERROR):/) print NR ":" $0
          }' test_output.plain || true)
          if [ -n "$warnings" ]; then
            echo "::warning::Warnings in test output (non-blocking)"
            printf '%s\n' "$warnings" | head -30
          fi
          if [ -n "$errors" ]; then
            echo "::error::Errors in test output"
            printf '%s\n' "$errors" | head -30
            fail=1
          fi
          if grep -qE '^[[:space:]]+[1-9][0-9]* Orphans' test_output.plain; then
            echo "::error::Per-test orphans detected; see ai/scratchpads/gut-orphans-research.md"
            grep -nE '^[[:space:]]+[1-9][0-9]* Orphans' test_output.plain | head -30
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Run Tests Summary
        if: always()
        run: |
          echo '## Run Tests Summary' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Run Summary|^Scripts|^Tests|Passing Tests|Failing Tests|^Asserts|^Time|All tests passed|failing tests' test_output.txt | sed 's/\x1b\[[0-9;]*m//g' >> "$GITHUB_STEP_SUMMARY" || echo 'No summary output found' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
